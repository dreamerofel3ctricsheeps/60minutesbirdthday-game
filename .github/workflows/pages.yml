# Publica el juego («1 Minuto para la Fiesta») en GitHub Pages.
# El juego es un sitio estático sin build. En cada push a main, este workflow
# sincroniza application/src a la RAÍZ de la rama gh-pages, CONSERVANDO la
# carpeta dev/ (el sitio de pruebas de la rama develop, que publica su propio
# workflow). GitHub Pages sirve gh-pages: raíz = juego publicado, /dev = testing.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
      - name: Sincronizar application/src → raíz de gh-pages (sin tocar /dev)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPO}.git" /tmp/ghpages
          rsync -a --delete --exclude dev --exclude .git application/src/ /tmp/ghpages/
          rm -rf /tmp/ghpages/tests
          sed -i -E "s/(\"(css|js)\/[^\"]+)\"/\1?v=${SHA}\"/g" /tmp/ghpages/index.html
          cd /tmp/ghpages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Despliegue de main ${SHA}"
          for i in 1 2 3; do git push -q origin gh-pages && break || git pull -q --rebase origin gh-pages; done
          echo "Raíz de gh-pages actualizada desde main ${SHA} (dev/ intacto)"
